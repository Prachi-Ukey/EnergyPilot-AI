
services:
  postgres:
    image: postgres:15-alpine
    container_name: energypilot_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-energypilot_db}
      POSTGRES_USER: ${POSTGRES_USER:-energypilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energypilot123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-energypilot} -d ${POSTGRES_DB:-energypilot_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - energypilot_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: energypilot_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-energypilot}:${POSTGRES_PASSWORD:-energypilot123}@postgres:5432/${POSTGRES_DB:-energypilot_db}
      CORS_ORIGINS: http://localhost:5174,http://localhost:5173,http://frontend:5173
    ports:
      - "8001:8000"
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - energypilot_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: energypilot_frontend
    environment:
      VITE_API_URL: http://localhost:8001/api
    ports:
      - "5174:5173"
    depends_on:
      - backend
    networks:
      - energypilot_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  energypilot_network:
    driver: bridge
